# AI Usage for Noctalia Shell.
#
# A headless service checks every account on a timer and publishes plain state;
# the desktop card, the bar widget and the panel only render that state.
# plugin_api 24 is the first level with the direct-argv form of runAsync(), which
# keeps account ids and paths out of a shell. Module require (22) and services
# starting on enable (17) are also required.

id          = "lukk17/ai-usage"
name        = "AI Usage"
version     = "1.0.0"
plugin_api  = 24
author      = "Łukasz Sarna"
license     = "GPL-3.0-or-later"
icon        = "chart-bar"
description = "Limits, spend and balance for Claude, ChatGPT, OpenAI, Anthropic, xAI, OpenCode, MiniMax, Requesty, Hugging Face and JetBrains AI."
tags        = ["ai", "usage", "limits", "spend", "desktop", "panel"]
dependencies = ["curl", "libsecret", "glib2"]

# Shared by the service, the card and the panel. Edited under
# Settings -> Plugins (the gear on the plugin row).
[[setting]]
key             = "refresh_seconds"
type            = "select"
label_key       = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
default         = "30"
options = [
  { value = "0",    label_key = "settings.refresh_seconds.option.manual" },
  { value = "30",   label_key = "settings.refresh_seconds.option.30s" },
  { value = "60",   label_key = "settings.refresh_seconds.option.1m" },
  { value = "300",  label_key = "settings.refresh_seconds.option.5m" },
  { value = "900",  label_key = "settings.refresh_seconds.option.15m" },
  { value = "1800", label_key = "settings.refresh_seconds.option.30m" },
  { value = "3600", label_key = "settings.refresh_seconds.option.1h" },
]

[[setting]]
key             = "show_model_stats"
type            = "bool"
label_key       = "settings.show_model_stats.label"
description_key = "settings.show_model_stats.description"
default         = true

# Headless poller. One instance per plugin, started by Noctalia.
[[service]]
id    = "poller"
entry = "service.luau"

# Full cards on the desktop.
[[desktop_widget]]
id    = "card"
entry = "card.luau"

  [[desktop_widget.setting]]
  key             = "show_header"
  type            = "bool"
  label_key       = "settings.show_header.label"
  description_key = "settings.show_header.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "show_details"
  type            = "bool"
  label_key       = "settings.show_details.label"
  description_key = "settings.show_details.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "card_width"
  type            = "int"
  label_key       = "settings.card_width.label"
  description_key = "settings.card_width.description"
  default         = 360
  min             = 220
  max             = 900

  [[desktop_widget.setting]]
  key             = "background"
  type            = "bool"
  label_key       = "settings.background.label"
  description_key = "settings.background.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "background_opacity"
  type            = "double"
  label_key       = "settings.background_opacity.label"
  description_key = "settings.background_opacity.description"
  default         = 0.85
  min             = 0.0
  max             = 1.0
  step            = 0.01
  visible_when    = { key = "background", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "card_opacity"
  type            = "double"
  label_key       = "settings.card_opacity.label"
  description_key = "settings.card_opacity.description"
  default         = 0.42
  min             = 0.0
  max             = 1.0
  step            = 0.01

  [[desktop_widget.setting]]
  key             = "dense"
  type            = "bool"
  label_key       = "settings.dense.label"
  description_key = "settings.dense.description"
  default         = false

# Compact bar widget, the equivalent of the KDE panel icon.
[[widget]]
id    = "usage"
entry = "bar.luau"

  [[widget.setting]]
  key             = "show_percent"
  type            = "bool"
  label_key       = "settings.show_percent.label"
  description_key = "settings.show_percent.description"
  default         = true

  [[widget.setting]]
  key             = "glyph"
  type            = "glyph"
  label_key       = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default         = "chart-bar"

  [[widget.setting]]
  key             = "mode"
  type            = "select"
  label_key       = "settings.mode.label"
  description_key = "settings.mode.description"
  default         = "worst"
  options = [
    { value = "worst",  label_key = "settings.mode.option.worst" },
    { value = "errors", label_key = "settings.mode.option.errors" },
    { value = "count",  label_key = "settings.mode.option.count" },
  ]

# Cards, account management and the refresh-interval pointer. Opened by the
# desktop card, the bar widget, or `noctalia msg panel-toggle lukk17/ai-usage:panel`.
[[panel]]
id         = "panel"
entry      = "panel.luau"
width      = 470
height     = 660
placement  = "floating"
position   = "center"
