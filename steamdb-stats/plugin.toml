# SteamDB Stats for Noctalia Shell.
#
# A headless poller reads Steam's own gameprocess_log.txt to detect the running
# AppID, resolves the game name from the library manifests, then fetches the
# public player numbers and 24-hour history. The desktop card renders the
# SteamDB-style summary with the same surface and graph metrics as Modern
# SysMonitor Plus.

id          = "linuxgamerlife/steamdb-stats"
name        = "SteamDB Stats"
version     = "0.2.0"
plugin_api  = 24
author      = "LinuxGamerLife"
license     = "MIT"
icon        = "brand-steam"
description = "Detects the Steam game you are playing and shows live players, 24-hour peak, all-time peak and a 24-hour graph."
tags        = ["gaming", "desktop"]
dependencies = ["curl"]

# ── Plugin-level polling ────────────────────────────────────────────────────

[[setting]]
key             = "detect_interval"
type            = "int"
label_key       = "settings.detect_interval.label"
description_key = "settings.detect_interval.description"
default         = 3
min             = 2
max             = 15
step            = 1

[[setting]]
key             = "current_refresh"
type            = "int"
label_key       = "settings.current_refresh.label"
description_key = "settings.current_refresh.description"
default         = 60
min             = 30
max             = 300
step            = 10

[[setting]]
key             = "stats_refresh"
type            = "int"
label_key       = "settings.stats_refresh.label"
description_key = "settings.stats_refresh.description"
default         = 600
min             = 300
max             = 3600
step            = 60

[[service]]
id    = "poller"
entry = "service.luau"

[[desktop_widget]]
id    = "card"
entry = "card.luau"

  # Host panel surface. Noctalia also renders a Background section for every
  # desktop widget; keeping these declarations here puts the panel toggle and
  # opacity at the top of the Widget section as well.

  [[desktop_widget.setting]]
  key             = "background"
  type            = "bool"
  label_key       = "settings.background.label"
  description_key = "settings.background.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "background_color"
  type            = "color"
  label_key       = "settings.background_color.label"
  description_key = "settings.background_color.description"
  default         = "surface"
  visible_when    = { key = "background", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "background_opacity"
  type            = "double"
  label_key       = "settings.background_opacity.label"
  description_key = "settings.background_opacity.description"
  default         = 0.8
  min             = 0.0
  max             = 1.0
  step            = 0.01
  visible_when    = { key = "background", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "background_radius"
  type            = "int"
  label_key       = "settings.background_radius.label"
  description_key = "settings.background_radius.description"
  default         = 12
  min             = 0
  max             = 48
  step            = 1
  visible_when    = { key = "background", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "background_padding"
  type            = "int"
  label_key       = "settings.background_padding.label"
  description_key = "settings.background_padding.description"
  default         = 10
  min             = 0
  max             = 32
  step            = 1
  visible_when    = { key = "background", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "show_card_settings"
  type            = "bool"
  label_key       = "settings.show_card_settings.label"
  description_key = "settings.show_card_settings.description"
  default         = false

  [[desktop_widget.setting]]
  key             = "show_styling"
  type            = "bool"
  label_key       = "settings.show_styling.label"
  description_key = "settings.show_styling.description"
  default         = false

  [[desktop_widget.setting]]
  key             = "show_scaling"
  type            = "bool"
  label_key       = "settings.show_scaling.label"
  description_key = "settings.show_scaling.description"
  default         = false

  [[desktop_widget.setting]]
  key             = "show_sections"
  type            = "bool"
  label_key       = "settings.show_sections.label"
  description_key = "settings.show_sections.description"
  default         = false

  [[desktop_widget.setting]]
  key             = "title"
  type            = "string"
  label_key       = "settings.title.label"
  description_key = "settings.title.description"
  default         = "SteamDB Stats"
  visible_when    = { key = "show_card_settings", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "content_width"
  type            = "int"
  label_key       = "settings.content_width.label"
  description_key = "settings.content_width.description"
  default         = 320
  min             = 240
  max             = 900
  step            = 4
  visible_when    = { key = "show_card_settings", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "card_gap"
  type            = "int"
  label_key       = "settings.card_gap.label"
  description_key = "settings.card_gap.description"
  default         = 10
  min             = 0
  max             = 32
  step            = 1
  advanced        = true
  visible_when    = { key = "show_card_settings", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "card_padding"
  type            = "int"
  label_key       = "settings.card_padding.label"
  description_key = "settings.card_padding.description"
  default         = 10
  min             = 0
  max             = 32
  step            = 1
  advanced        = true
  visible_when    = { key = "show_card_settings", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "card_radius"
  type            = "int"
  label_key       = "settings.card_radius.label"
  description_key = "settings.card_radius.description"
  default         = 8
  min             = 0
  max             = 32
  step            = 1
  advanced        = true
  visible_when    = { key = "show_card_settings", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "card_fill_color"
  type            = "color"
  label_key       = "settings.card_fill_color.label"
  description_key = "settings.card_fill_color.description"
