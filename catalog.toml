# Index for using this directory as a Noctalia plugin source:
#   noctalia msg plugins source add dualsense path /path/to/lgl-ds-noctalia-widget
# The per-plugin plugin.toml stays authoritative.

[[plugin]]
id           = "deadYokai/dualsense"
name         = "DualSense Battery"
version      = "1.0.1"
author       = "deadYokai"
license      = "MIT"
icon         = "device-gamepad-2"
description  = "Battery level, charging state, lightbar sync and ds4u profile controls for DualSense and DualSense Edge controllers."
deprecated   = false
plugin_api   = 17
tags         = ["gaming", "hardware", "battery", "dualsense", "desktop"]
dependencies = ["python3"]
