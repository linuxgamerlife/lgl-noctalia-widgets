# Steam Controller 2 battery widget for Noctalia Shell.
#
# A headless service runs the bundled HID reader and publishes the controller
# state; the desktop widget renders the card. plugin_api 17 is the first level
# where services start when a plugin is enabled (not only at shell launch).

id          = "jahrek/steam-controller"
name        = "Steam Controller Battery"
version     = "2.4.0"
plugin_api  = 17
author      = "Jahrek"
license     = "MIT"
icon        = "device-gamepad-2"
description = "Battery level, charging state, link quality and live input visualisation for the Steam Controller 2, with configurable colours, outline and battery fill opacity."
tags        = ["gaming", "hardware", "battery", "desktop"]
dependencies = ["python3"]

# Shared by the service (notifications) and the desktop widget (low state).
[[setting]]
key             = "low_threshold"
type            = "int"
label_key       = "settings.low_threshold.label"
description_key = "settings.low_threshold.description"
default         = 20
min             = 0
max             = 100

[[setting]]
key             = "notify_low"
type            = "bool"
label_key       = "settings.notify_low.label"
description_key = "settings.notify_low.description"
default         = true

# Headless HID reader. One instance per plugin, started by Noctalia.
[[service]]
id    = "battery"
entry = "battery.luau"

# The desktop card.
[[desktop_widget]]
id    = "card"
entry = "card.luau"

  [[desktop_widget.setting]]
  key             = "illustration_color"
  type            = "color"
  label_key       = "settings.illustration_color.label"
  description_key = "settings.illustration_color.description"
  default         = "#e8ebef"

  [[desktop_widget.setting]]
  key             = "controller_body_color"
  type            = "color"
  label_key       = "settings.controller_body_color.label"
  description_key = "settings.controller_body_color.description"
  default         = "#2c3035"

  [[desktop_widget.setting]]
  key             = "controller_stroke_width"
  type            = "double"
  label_key       = "settings.controller_stroke_width.label"
  description_key = "settings.controller_stroke_width.description"
  default         = 3.4
  min             = 0.5
  max             = 8.0

  [[desktop_widget.setting]]
  key             = "battery_color_mode"
  type            = "select"
  label_key       = "settings.battery_color_mode.label"
  description_key = "settings.battery_color_mode.description"
  default         = "connection"
  options = [
    { value = "connection", label_key = "settings.battery_color_mode.option.connection" },
    { value = "custom",     label_key = "settings.battery_color_mode.option.custom" },
  ]

  [[desktop_widget.setting]]
  key             = "battery_fill_color"
  type            = "color"
  label_key       = "settings.battery_fill_color.label"
  description_key = "settings.battery_fill_color.description"
  default         = "#fcfcfc"
  visible_when    = { key = "battery_color_mode", values = ["custom"] }

  [[desktop_widget.setting]]
  key             = "battery_fill_opacity"
  type            = "double"
  label_key       = "settings.battery_fill_opacity.label"
  description_key = "settings.battery_fill_opacity.description"
  default         = 1.0
  min             = 0.0
  max             = 1.0
  step            = 0.05

  [[desktop_widget.setting]]
  key             = "battery_low_color"
  type            = "color"
  label_key       = "settings.battery_low_color.label"
  description_key = "settings.battery_low_color.description"
  default         = "#ed4c4c"

  [[desktop_widget.setting]]
  key             = "text_color"
  type            = "color"
  label_key       = "settings.text_color.label"
  description_key = "settings.text_color.description"
  default         = "on_surface"

  [[desktop_widget.setting]]
  key             = "muted_text_color"
  type            = "color"
  label_key       = "settings.muted_text_color.label"
  description_key = "settings.muted_text_color.description"
  default         = "on_surface_variant"

  [[desktop_widget.setting]]
  key             = "show_battery_bar"
  type            = "bool"
  label_key       = "settings.show_battery_bar.label"
  description_key = "settings.show_battery_bar.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "show_percentage"
  type            = "bool"
  label_key       = "settings.show_percentage.label"
  description_key = "settings.show_percentage.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "show_status"
  type            = "bool"
  label_key       = "settings.show_status.label"
  description_key = "settings.show_status.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "show_live_inputs"
  type            = "bool"
  label_key       = "settings.show_live_inputs.label"
  description_key = "settings.show_live_inputs.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "input_highlight_color"
  type            = "color"
  label_key       = "settings.input_highlight_color.label"
  description_key = "settings.input_highlight_color.description"
  default         = "primary"
  visible_when    = { key = "show_live_inputs", values = ["true"] }

  [[desktop_widget.setting]]
  key             = "show_signal"
  type            = "bool"
  label_key       = "settings.show_signal.label"
  description_key = "settings.show_signal.description"
  default         = true

  [[desktop_widget.setting]]
  key             = "signal_style"
  type            = "select"
  label_key       = "settings.signal_style.label"
  description_key = "settings.signal_style.description"
  default         = "bars"
  options = [
    { value = "bars",     label_key = "settings.signal_style.option.bars" },
    { value = "bars_dbm", label_key = "settings.signal_style.option.bars_dbm" },
    { value = "dbm",      label_key = "settings.signal_style.option.dbm" },
  ]
