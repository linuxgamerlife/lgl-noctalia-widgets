# Modern SysMonitor Plus for Noctalia Shell.
#
# A headless poller reads /proc, /sys, hwmon, AMD sysfs, nvidia-smi and `df`,
# then publishes one plain `stats` table. The desktop card only watches that
# table and renders the solid-bar and live-chart system monitor.
#
# plugin_api 22 is the first level with relative module require, which this port
# uses for lib/. Services start when a plugin is enabled at 17; opening the
# plugin's own settings needs 15.

id          = "unsaidspeech/modern-sysmonitor-plus"
name        = "Modern SysMonitor Plus"
version     = "1.0.0"
plugin_api  = 22
author      = "UnsaidSpeech"
license     = "GPL-2.0-or-later"
icon        = "cpu"
description = "CPU, GPU, RAM, VRAM, network and physical-disk monitoring with solid bars, live usage/network charts and theme-aware colours."
tags        = ["system", "monitor", "hardware", "desktop"]
dependencies = ["pciutils", "vulkan-tools"]

# Shared by the service (sampling) and the card (stale-state timeout).
[[setting]]
key             = "update_interval"
type            = "int"
label_key       = "settings.update_interval.label"
description_key = "settings.update_interval.description"
default         = 2
min             = 1
max             = 60
step            = 1

# 0 = automatic (a hwmon fan label containing "cpu"). 1..16 selects fan<N> on
# the motherboard chip with the most fan inputs.
[[setting]]
key             = "cpu_fan_number"
type            = "int"
label_key       = "settings.cpu_fan_number.label"
description_key = "settings.cpu_fan_number.description"
default         = 0
min             = 0
max             = 16
step            = 1

# Headless poller. One instance per plugin, started by Noctalia.
[[service]]
id    = "poller"
entry = "service.luau"

# The desktop card.
[[desktop_widget]]
id    = "card"
entry = "card.luau"

